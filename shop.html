<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>LUMÉA | Shop</title>
  <meta name="description" content="Shop LUMÉA luxury skincare." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

</head>
<body>
  <div id="header"></div>

  <main class="container">
    <header class="page-header">
      <h1>Shop</h1>
      <p>Discover LUMÉA essentials — curated for glow, calm & barrier care.</p>
    </header>

    <section class="shop-toolbar">
      <input id="searchInput" class="input" type="search" placeholder="Search products..." />
    
      <select id="categorySelect" class="select">
        <option value="all">Category: All</option>
        <option value="Serums">Serums</option>
        <option value="Creams">Creams</option>
        <option value="Masks">Masks</option>
        <option value="Cleansers">Cleansers</option>
        <option value="Toners">Toners</option>
        <option value="Oils">Oils</option>
        <option value="Gift Sets">Gift Sets</option>
        <option value="Body">Body</option>
      </select>
    
      <select id="skinSelect" class="select">
        <option value="all">Skin: All</option>
        <option value="All">All</option>
        <option value="Oily">Oily</option>
        <option value="Combination">Combination</option>
        <option value="Dry">Dry</option>
        <option value="Sensitive">Sensitive</option>
        <option value="Normal">Normal</option>
      </select>
    
      <div class="range-wrap">
        <label class="range-label" for="priceRange">
          Max price: <span id="priceValue">5000</span> RSD
        </label>
        <input id="priceRange" class="range" type="range" min="500" max="6000" step="100" value="6000" />
      </div>
    
      <div class="checks">
        <label class="check"><input id="saleOnly" type="checkbox" /> On sale</label>
        <label class="check"><input id="bestOnly" type="checkbox" /> Bestseller</label>
      </div>
    
      <select id="sortSelect" class="select">
        <option value="featured">Sort: Featured</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
        <option value="rating-desc">Rating: High → Low</option>
        <option value="name-asc">Name: A → Z</option>
      </select>
    </section>
    

    <section id="status" class="status" aria-live="polite"></section>

    <section id="productGrid" class="grid"></section>

    <nav class="pagination" aria-label="Pagination">
      <button id="prevBtn" class="btn btn--ghost" type="button">Prev</button>
      <div id="pageInfo" class="page-info">Page 1</div>
      <button id="nextBtn" class="btn btn--ghost" type="button">Next</button>
    </nav>
  </main>

  <div id="footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/shop.js"></script>
</body>
</html>
