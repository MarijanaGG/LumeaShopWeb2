<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <title>LUMÉA | Checkout</title>
  <meta name="description" content="Checkout - LUMÉA luxury skincare." />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <link rel="icon" type="image/png" href="assets/img/favicon.png">

</head>
<body>
  <div id="header"></div>

  <main class="container">
    <header class="page-header">
      <h1>Checkout</h1>
      <p>Enter your details to complete the order.</p>
    </header>

    <section id="formStatus" class="status" aria-live="polite"></section>

    <form id="checkoutForm" class="form" novalidate>
      <div class="form-grid">
        <div class="field">
          <label for="fullName">Full name *</label>
          <input id="fullName" class="input" type="text" placeholder="Marijana Gajić" />
          <small class="error" id="errFullName"></small>
        </div>

        <div class="field">
          <label for="email">Email *</label>
          <input id="email" class="input" type="email" placeholder="maja@gmail.com" />
          <small class="error" id="errEmail"></small>
        </div>

        <div class="field">
          <label for="phone">Phone *</label>
          <input id="phone" class="input" type="tel" placeholder="+381 64 123 4567" />
          <small class="error" id="errPhone"></small>
        </div>

        <div class="field">
          <label for="city">City *</label>
          <select id="city" class="select">
            <option value="">Choose...</option>
            <option>Beograd</option>
            <option>Novi Sad</option>
            <option>Niš</option>
            <option>Kragujevac</option>
            <option>Subotica</option>
          </select>
          <small class="error" id="errCity"></small>
        </div>

        <div class="field field--full">
          <label for="address">Address *</label>
          <input id="address" class="input" type="text" placeholder="Bulevar kralja Aleksandra 10" />
          <small class="error" id="errAddress"></small>
        </div>

        <div class="field">
          <label for="zip">ZIP / Postal code *</label>
          <input id="zip" class="input" type="text" placeholder="11000" />
          <small class="error" id="errZip"></small>
        </div>
      </div>

      <div class="field">
        <label>Payment method *</label>
        <div class="radios">
          <label class="radio">
            <input type="radio" name="payment" value="card" />
            Card
          </label>
          <label class="radio">
            <input type="radio" name="payment" value="cod" />
            Cash on delivery
          </label>
        </div>
        <small class="error" id="errPayment"></small>
      </div>

      <label class="check" style="margin-top:10px;">
        <input id="terms" type="checkbox" />
        I agree to the terms *
      </label>
      <small class="error" id="errTerms"></small>

      <div class="checkout-actions">
        <a class="btn btn--ghost" href="cart.html">Back to cart</a>
        <button class="btn btn--primary" type="submit">Place order</button>
      </div>
    </form>
  </main>

  <div id="footer"></div>

  <script src="assets/js/app.js"></script>
  <script src="assets/js/checkout.js"></script>
</body>
</html>
